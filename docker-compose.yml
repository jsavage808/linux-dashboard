services:
  backend:
    build:
      context: ./backend
    container_name: linux-dashboard-backend
    environment:
      ADSB_JSON_URL: ${ADSB_JSON_URL:-}
      ADSB_RECEIVER_LAT: ${ADSB_RECEIVER_LAT:-}
      ADSB_RECEIVER_LON: ${ADSB_RECEIVER_LON:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: linux-dashboard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
