services:
  backend:
    build:
      context: ./backend
    container_name: linux-dashboard-backend
    environment:
      ADSB_JSON_URL: ${ADSB_JSON_URL:-}
      ADSB_RECEIVER_LAT: ${ADSB_RECEIVER_LAT:-}
      ADSB_RECEIVER_LON: ${ADSB_RECEIVER_LON:-}
      CHAT_DATA_DIR: /app/data/chats
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: linux-dashboard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
